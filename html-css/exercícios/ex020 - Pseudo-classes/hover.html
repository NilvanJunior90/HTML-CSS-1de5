<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de hover</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        div > p {
            display: none;
        }
        
        div:hover > p {
            display: block;
            color: aliceblue;
            text-align: center;
            background-color: red;
            width: 300px;
        }

        div:hover {
            color: blue;
        }
    </style>
</head>
<body>
    <h1>Exemplo de hover</h1>
    <p>Passe o mouse sobre o texto abaixo:</p>
    <br>
    <div>
        >>> Passe o mouse aqui! <br>
        <p>Eu te amo Tatiana! <br> Parabéns pelo nosso dia! <br> S2S2S2</p> <br>
    </div>
    <p>Fim do exemplo.</p> <br>
</body>
</html>
